##### experiment wide
name: 'dorn_pmv_l1o'
iterations: 100
seed: 13

##### data specific
dataset_name: 'dorn231'
dataset: 'data/dorn/DORN_env_pmv_231.csv' 
dataset_survey: 'data/dorn/DORN_qns_all.csv' 
dataset_type: 'sensor' # 'sensor', 'sensor_qns'
target_column: 'thermal_cozie'
target_values:
    - 9.0
    - 10.0 
    - 11.0
train_test_ratio: 0.8
categorical_features: # NOTE: can be update accordingly
    - 'clothing'
# questions are only used when the `dataset_type` is `sensor_qns`
qns_encoding_idx: []
qns_categories: []
gamma: 0.0
scorer: 'f1_micro'

leave_one_out: True  #change: added to match our new approach, by setting to true, it will run the leave-one-out approach
