# in this version, if questions-based label missing, we skip user (no crash) in cohort.py

##### experiment wide
 #########################################################

iterations: 72    # keep 30+ for real runs
seed: 42

##### data paths ##############################################################
dataset_name: 'PersonAI'  # arbitrary label, kept for logging only
dataset: 'personai/final_main_dataset_no_missing_ALLENC_new_bpm.csv' #final_main_dataset_no_missing_ALLENC
dataset_survey: 'personai/cold_start_data_full.csv' #'cold_start_data_full_big5.csv' #'cold_start_data_full_survey.csv' #'cold_start_data_full.csv'
dataset_with_time: 'personai/final_main_dataset_no_missing_ALLENC_with_time_and_hr_age.csv'

##### precomputed PCM file ####################################################
# stem of the stored PCM pickle, relative to models/ and without the .pickle extension
# (only used when precomputed_pcm: True; the matching *_acc_f1_micro / *_acc_cohen_kappa
# files are loaded too if present, but their content is unused)
pcm_file: 'PersonAi/dict_pcm_rdf_sensor_at_f1_micro_personai'

##### excluded users ###########################################################
# user_ids to leave out of the PCM / cross-model computations entirely
# (dataset-specific quirks; [] for a dataset with none to exclude)
excluded_users:
  - 'id016'  # PersonAI-specific: this user's data caused problems, kept excluded for continuity

##### automatic-clustering survey features ####################################
# columns of dataset_survey used for automatic ('-1') clustering; only matters
# when cluster_forced: '-1' ([] = use every column in the dataset_survey file)
qns_features: []

##### occupant filter (optional) ###############################################
# null = all occupants. Otherwise only occupants at/below the lower or at/above the upper
# percentile of `column` stay, in BOTH the sensor and the survey data (as the original
# CCM did for its HSPS/SWLS cohorts), e.g.
# extremes_filter: {column: swls_score, lower_q: 0.25, upper_q: 0.75}
# With the filter on, set `iterations` <= the number of kept occupants (leave-one-out).
extremes_filter: null

# dataset: 'personai/all_aircontrol_with_surveys_hr_with_new_bpm_new.csv'
# dataset_survey: 'personai/cold_start_data.csv'
# dataset_with_time: 'personai/final_main_dataset_no_missing_ALLENC_with_time_and_hr_age.csv'

dataset_type: 'sensor'
target_column: 'thermal_cozie'
target_values:
  - 9.0
  - 10.0
  - 11.0

##### model input features ####################################################
# columns of the dataset that are used as model inputs (everything else is dropped after loading)
variable_features:             # change within a person; used by ALL models (personal models, cross-model performance, pooled models)
                               # the order must match the precomputed PCMs (models/dict_pcm_*)
  - 't_ubi'
  - 'rh_ubi'
  - 'hr_ubi'
  - 'bpm_time_diff_log'        # only in the with-time file (data_set_with_time_bool: True)
  - 'CO2'
  - 'activity'
fixed_features:                # constant within a person; ONLY used by the pooled models (general baseline + cohort models)
  - 'sex'                      # [] = the pooled models use the variable features only
  - 'fitness_level'
  - 'height_cm'
  - 'weight_kg'

##### split parameters ########################################################
leave_1_out: True
train_test_ratio: 0.8 
test_user_data: 1              # 1, 0.5, 0.25, 0.125, 0.0625 | 1, 3, 5, 7 # 1 = use all env samples per test user

##### environmental (sensor) categorical features ############################
categorical_features:          # these stay because the RF models still need them
  - 'sex'
  - 'fitness_level'

feedback_sim: 'feedback-dist'  # 'feedback-dist', 'baseline'

##### cold-start clustering inputs ###########################################
# Categorical columns *inside* at_qns_psych.csv (0-based indices)

# Only needed for psych surveys — remove if not using at_qns_psych.csv
qns_encoding_idx: [] # Indices of columns to encode (1-based if matching CSV columns; adjust if zero-based)
  # - 9   # bfi2s_sociability
  # - 10  # bfi2s_assertiveness
  # - 11  # bfi2s_activity
  # - 12  # bfi2s_compassion
  # - 13  # bfi2s_politeness
  # - 14  # bfi2s_trust
  # - 15  # bfi2s_orderliness
  # - 16  # bfi2s_industriousness
  # - 17  # bfi2s_reliability
  # - 18  # bfi2s_anxiety
  # - 20  # bfi2s_emotional_instability
  # - 21  # bfi2s_aesthetic_sensitivity
  # - 22  # bfi2s_intellectual_curiosity
  # - 23  # bfi2s_creative_imagination

  # - 15  # maia_noticing
  # - 16  # maia_not_distracting
  # - 17  # maia_not_worrying
  # - 18  # maia_attention_regulation
  # - 19  # maia_emotional_awareness
  # - 20  # maia_self_regulation
  # - 21  # maia_body_listening
  # - 22  # maia_trusting
  # - 23  # bfi2s_sociability
  # - 24  # bfi2s_assertiveness
  # - 25  # bfi2s_activity
  # - 26  # bfi2s_compassion
  # - 27  # bfi2s_politeness
  # - 28  # bfi2s_trust
  # - 29  # bfi2s_orderliness
  # - 30  # bfi2s_industriousness
  # - 31  # bfi2s_reliability
  # - 32  # bfi2s_anxiety
  # - 33  # bfi2s_depression
  # - 34  # bfi2s_emotional_instability
  # - 35  # bfi2s_aesthetic_sensitivity
  # - 36  # bfi2s_intellectual_curiosity
  # - 37  # bfi2s_creative_imagination

qns_categories: []          # only needed when you pre-specify category orders
gamma: 0.0                  # leave at 0 unless you use hybrid similarity


##### user-profiling options ##################################################
divergence: 'jensen-shannon'
qns_sim: 'cosine'           # cosine or euclidean

##### modeling ###############################################################
model: 'rdf'                # 'rdf', 'xgb'  # random-forest
scorer: 'f1_micro'
use_val: False              # by default should be False
parameter_finetuning: False

##### cohort creation ###############################stionnaire, γ=cross-model
coefficients: # can take plenty different values (Feedback, Qns, CrossPerf) # α=feedback, β=que
    - 0.5 # alpha
    - 0 # beta
    - 0.5 # gamma


name: PersonAI_cold_swls_score_wrong #,,cold_tolerance #neg emotion, open minded
cluster_algo: 'kmeans'           # 'spectral', 'kprototype', 'kmeans' # psych-only mixed-data clustering
cluster_num: 2                    # can take many different values
cluster_forced: 'swls_score' #'cold_tolerance' #           # automatic  #'-1', 'sex', 'sensitive_thermal_env', 'subtleties_awareness', 'stimuli_awareness' [specific columns]
cluster_assign: 'questions'     # 'performance', 'questions', 'performance-noretrain' 
cluster_predict_criteria: 'cold'  # 'cold', 'warm'
worst_cluster: True             # leave at 1 unless you intentionally mis-assign ??
data_set_with_time_bool: True

##### speed-ups / debugging ###################################################
precomputed_pcm: True  # by default should be True # PCM pre-computed makes experiment runs faster
precomputed_test_users: False  # by default should be False # aux debugging

##### resampling options ###################################################
resample_ccm: False
SMOTENC_class: False
SMOTENC_user : False

class_limit_remove: 0 # if >0 will remove participants that have a class with less entries COMPLETELY from the code

class_limit_no_resampling: False #if True will not resample any classes for users where one class has less than class_min_resampling entries
                                 #if False will not resample the class that has less than class_min_resampling entries
                                 # BUT will resample other classes
class_min_resampling: 5 #!!! this limit is also how many k neighbors are used for SMOTE

downsample: False
downsample_60: False
min_total_number : 0 #MIN 10 if you downsample!!!

SMOTENC_all_class: False